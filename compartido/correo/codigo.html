<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Código para recuperar tu acceso</title></head>
<body style="margin:0;padding:24px 0;background:#f5f6fa;font-family:Segoe UI,Arial,sans-serif;color:#1f2430;">

  <tr><td style="background:#c74634;border-radius:12px 12px 0 0;padding:18px 28px;color:#ffffff;font-size:20px;font-weight:700;">PRPagos</td></tr>
  <tr><td style="padding:24px 28px;">

</td></tr></table>
