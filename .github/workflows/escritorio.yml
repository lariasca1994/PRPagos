# Publica la aplicación de escritorio como ejecutable de Windows: cada push a
# main que toque el escritorio (o las consultas y plantillas compartidas)
# compila, empaqueta con jpackage (PRPagos.exe con Java incluido) y crea un
# Release en GitHub con dos descargas:
#   - Simulador-de-pagos-escritorio-<versión>.zip   portable: descomprimir y abrir PRPagos.exe
#   - Simulador-de-pagos-<versión>.exe              instalador automático (sin preguntas) con desinstalador
# El título y las descargas usan el nombre visible del producto; los nombres
# internos de la aplicación no cambian porque el actualizador los usa.
# El enlace estable es /releases/latest. Repositorio público: sin costo.
# Luego registra la versión y la huella SHA-256 del .zip en la base: las
# aplicaciones instaladas se actualizan solas (ver Actualizador.java).
# El paquete no lleva configuración ni claves: la aplicación pide todos los
# datos a la API de la web. Se instala y se usa, sin nada más.
name: Publicar escritorio

on:
  push:
    branches: [main]
    paths:
      - 'escritorio/src/**'
      - 'escritorio/lib/**'
      - 'escritorio/resources/**'
      - 'escritorio/empaquetar.ps1'
      - 'escritorio/instalador.iss'
      - 'escritorio/msix.ps1'
      - '.github/workflows/escritorio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritorio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      # Amazon Corretto (OpenJDK libre): la serie 21 ya trae 21.0.13, que corrige la alerta de
      # Oracle CVE-2026-114820 (JSSE, raíces de eMudhra); Temurin aún no la publicaba.
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'

      # Inno Setup 6 (gratuito) arma el instalador automático con desinstalador.
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # 1) La aplicación (PRPagos.exe con su Java), aún sin instalador.
      - name: Empaquetar aplicación
        shell: pwsh
        working-directory: escritorio
        run: ./empaquetar.ps1 -Version $env:VERSION

      # Firma de código con SignPath: desactivada (la firma gratuita de SignPath
      # Foundation no se aprobó y la de pago tiene costo). Solo correría si existieran
      # la variable SIGNPATH_ORGANIZATION_ID y el secreto SIGNPATH_API_TOKEN. Sin ellos, todo
      # se publica igual que antes, sin firmar. Se firma primero la aplicación
      # (para que el ejecutable instalado quede firmado) y después el instalador.
      - name: Subir aplicación para firmar
        id: app-sin-firmar
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-sin-firmar
          path: escritorio/build/dist/PRPagos

      - name: Firmar aplicación
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: aplicacion
          github-artifact-id: ${{ steps.app-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: escritorio/build/firmado/aplicacion

      - name: Usar la aplicación firmada
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        working-directory: escritorio/build
        run: |
          Remove-Item -Recurse -Force dist/PRPagos
          Move-Item firmado/aplicacion dist/PRPagos
          $firma = Get-AuthenticodeSignature dist/PRPagos/PRPagos.exe
          if ($firma.Status -ne 'Valid') { throw "PRPagos.exe no quedó firmado: $($firma.StatusMessage)" }

      # 2) Instalador automático con la aplicación (ya firmada si aplica).
      - name: Armar instalador
        shell: pwsh
        working-directory: escritorio
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$env:VERSION" instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup (instalador)" }

      - name: Subir instalador para firmar
        id: instalador-sin-firmar
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: escritorio/build/dist/PRPagos-${{ env.VERSION }}.exe

      - name: Firmar instalador
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.instalador-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: escritorio/build/firmado/instalador

      - name: Usar el instalador firmado
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        working-directory: escritorio/build
        run: |
          Copy-Item -Force "firmado/instalador/PRPagos-$env:VERSION.exe" "dist/PRPagos-$env:VERSION.exe"
          $firma = Get-AuthenticodeSignature "dist/PRPagos-$env:VERSION.exe"
          if ($firma.Status -ne 'Valid') { throw "El instalador no quedó firmado: $($firma.StatusMessage)" }

      - name: Comprimir versión portable
        shell: pwsh
        working-directory: escritorio/build/dist
        run: |
          Compress-Archive -Path PRPagos -DestinationPath "Simulador-de-pagos-escritorio-$env:VERSION.zip"
          Copy-Item "PRPagos-$env:VERSION.exe" "Simulador-de-pagos-$env:VERSION.exe"

      # Microsoft Store: paquete MSIX SIN firmar (Microsoft lo firma al publicarlo). Solo
      # se arma si existen las variables del repositorio STORE_IDENTITY_NAME, STORE_PUBLISHER
      # y STORE_PUBLISHER_DISPLAY_NAME (datos de Partner Center); sin ellas se omite y todo
      # sigue igual. Queda como artefacto del workflow, no en el Release: sin firma no se
      # instala. Procedimiento en docs/STORE.md.
      - name: Armar paquete para Microsoft Store
        if: ${{ vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != '' }}
        shell: powershell
        working-directory: escritorio
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
        run: |
          ./msix.ps1 -Version $env:VERSION -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME `
            -DisplayName $(if ($env:STORE_DISPLAY_NAME) { $env:STORE_DISPLAY_NAME } else { "Simulador de pagos" })

      - name: Guardar paquete para Microsoft Store
        if: ${{ vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-${{ env.VERSION }}
          path: escritorio/build/dist/Simulador-de-pagos-${{ env.VERSION }}.msix
          retention-days: 15
          if-no-files-found: error
      - name: Crear Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = 'escritorio/build/dist'
          $notas = @"
          Simulador de pagos para Windows (Java incluido, no hace falta instalar nada más).

          - **Simulador-de-pagos-$env:VERSION.exe**: instalador automático: se instala sin preguntas, crea los accesos directos y abre la aplicación. Se desinstala desde Configuración > Aplicaciones instaladas o desde su acceso de desinstalación en el menú Inicio.
          - **Simulador-de-pagos-escritorio-$env:VERSION.zip**: versión portable; descomprime y abre ``PRPagos.exe``.

          Se instala y se usa: no necesita configuración. Los datos son los mismos de la web (misma cuenta).
          "@
          gh release create "escritorio-v$env:VERSION" `
            "$dist/Simulador-de-pagos-$env:VERSION.exe" "$dist/Simulador-de-pagos-escritorio-$env:VERSION.zip" `
            --title "Simulador de pagos (escritorio) $env:VERSION" --notes $notas --latest --target $env:GITHUB_SHA

      # Actualización automática: registra la versión y la huella SHA-256 del .zip en la
      # base (vía la web). Las aplicaciones instaladas la comprueban al abrir y cada hora,
      # y solo instalan un paquete de GitHub cuya huella coincida con esta.
      - name: Registrar versión para la actualización automática
        shell: pwsh
        env:
          TAREAS_TOKEN: ${{ secrets.TAREAS_TOKEN }}
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: |
          $zip = "escritorio/build/dist/Simulador-de-pagos-escritorio-$env:VERSION.zip"
          $cuerpo = @{
            version = $env:VERSION
            url     = "https://github.com/${{ github.repository }}/releases/download/escritorio-v$env:VERSION/Simulador-de-pagos-escritorio-$env:VERSION.zip"
            sha256  = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          } | ConvertTo-Json
          # La web puede estar desplegándose en este mismo push: se reintenta.
          for ($i = 1; $i -le 10; $i++) {
            try {
              Invoke-RestMethod -Method Post -Uri "$env:URL_PUBLICA/tareas/version-escritorio" `
                -Headers @{ 'X-Tarea-Token' = $env:TAREAS_TOKEN } -ContentType 'application/json' -Body $cuerpo
              exit 0
            } catch {
              Write-Host "Intento $i falló: $($_.Exception.Message)"; Start-Sleep -Seconds 30
            }
          }
          exit 1
