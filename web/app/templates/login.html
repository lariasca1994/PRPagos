{% extends "base.html" %}
{% block titulo %}Iniciar sesión - PRPagos{% endblock %}
{% block contenido %}
<section class="tarjeta-formulario">
    <h1>Iniciar sesión</h1>
    {% if error %}<p class="aviso error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
        <label for="usuario">Usuario (correo @EAN.com)</label>
        <input type="email" id="usuario" name="usuario" required autofocus>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <button type="submit" class="boton">Ingresar</button>
    </form>
    <p>¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
    <p><a href="/recuperar">Olvidé mi contraseña</a></p>
</section>
{% endblock %}
