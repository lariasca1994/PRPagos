{% extends "base.html" %}
{% block titulo %}Nuevo registro - PRPagos{% endblock %}
{% block contenido %}
<section class="tarjeta-formulario">
    <h1>Nuevo registro</h1>
    {% if error %}<p class="aviso error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/registros/nuevo">
        {% include "fragmentos/formulario_registro.html" %}
        <button type="submit" class="boton">Guardar</button>
    </form>
    <p><a href="/registros">Volver a consultar registros</a></p>
</section>
<script src="/static/registros.js" defer></script>
{% endblock %}
